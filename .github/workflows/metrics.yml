name: Metrics

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/metrics.yml"
      - "scripts/generate-trofeus.mjs"

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Gerar conquistas dinamicas
        env:
          GITHUB_TOKEN: ${{ secrets.METRICS_TOKEN }}
          GITHUB_USERNAME: AndreyODev
        run: node scripts/generate-trofeus.mjs

      - name: Commit e push dos assets
        run: |
          git config user.name "Andrey Oliveira"
          git config user.email "andreyoliveira72005@gmail.com"
          git add assets/trofeus.svg
          if git diff --staged --quiet; then
            echo "Sem mudancas nos assets."
            exit 0
          fi
          git commit -m "Update assets/trofeus.svg [Skip GitHub Action]"
          git push origin HEAD:main
